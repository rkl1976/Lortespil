<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lort på Løb - Verdensturné</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Fredoka', sans-serif; }
  body { touch-action: none; position: fixed; width: 100%; }
  #game {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: none;
    transition: background 0.8s ease;
  }
  .world-toilet { background: linear-gradient(180deg,#d8e8f2 0%,#f0f4f8 50%,#b8c8d4 50%,#8898a8 100%); }
  .world-kloak  { background: linear-gradient(180deg,#2a1808 0%,#4a3018 40%,#3b2509 40%,#1a0a02 100%); }
  .world-skov   { background: linear-gradient(180deg,#7dc6ff 0%,#a8e0ff 38%,#8dd96e 38%,#3a7a2a 100%); }
  .world-strand { background: linear-gradient(180deg,#ffdf7a 0%,#ffe8a8 35%,#f4d89c 35%,#d4a858 60%,#4a9fd6 60%,#2a6a9a 100%); }
  .world-rum    { background: radial-gradient(ellipse at center,#2a0858 0%,#0a0220 70%,#000 100%); }

  .decor { position: absolute; pointer-events: none; }
  .poop {
    position: absolute;
    font-size: 56px;
    pointer-events: none;
    will-change: transform;
    z-index: 10;
    filter: drop-shadow(3px 5px 0 rgba(0,0,0,0.25));
  }
  .poop-inner {
    display: inline-block;
    animation: wiggle 0.35s infinite alternate ease-in-out;
  }
  @keyframes wiggle {
    0% { transform: rotate(-10deg) scale(1, 0.95); }
    100% { transform: rotate(10deg) scale(1.05, 1.05); }
  }
  .collectible {
    position: absolute;
    font-size: 40px;
    pointer-events: none;
    filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.2));
    animation: bob 1s infinite alternate ease-in-out;
  }
  @keyframes bob {
    from { transform: translate(-50%, -58%) rotate(-8deg); }
    to { transform: translate(-50%, -45%) rotate(8deg); }
  }
  .enemy {
    position: absolute;
    font-size: 34px;
    pointer-events: none;
    filter: drop-shadow(1px 2px 0 rgba(0,0,0,0.35));
    will-change: transform;
    z-index: 5;
  }
  .sparkle {
    position: absolute;
    font-size: 32px;
    pointer-events: none;
    animation: sparkle 0.7s forwards ease-out;
    font-family: 'Bungee', sans-serif;
    color: #fff9e6;
    text-shadow: 2px 2px 0 #3b2509;
    z-index: 15;
  }
  @keyframes sparkle {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
    100% { opacity: 0; transform: translate(-50%, -180%) scale(1.4); }
  }
  .power-up {
    position: absolute;
    font-size: 46px;
    pointer-events: none;
    filter:
      drop-shadow(0 0 12px #ffd23f)
      drop-shadow(0 0 20px #ff8a3d)
      drop-shadow(2px 3px 0 rgba(0,0,0,0.3));
    animation: powerBob 0.7s infinite alternate ease-in-out;
    z-index: 8;
  }
  .power-up::after {
    content: '✨';
    position: absolute;
    font-size: 22px;
    top: -14px;
    right: -14px;
    animation: twinkle 0.6s infinite alternate;
    filter: none;
  }
  @keyframes powerBob {
    from { transform: translate(-50%, -60%) rotate(-15deg) scale(1); }
    to { transform: translate(-50%, -42%) rotate(15deg) scale(1.12); }
  }
  @keyframes twinkle {
    from { opacity: 0.4; transform: scale(0.7) rotate(0deg); }
    to { opacity: 1; transform: scale(1.3) rotate(40deg); }
  }
  .enemy-dying { animation: flyDie 0.6s forwards ease-in; }
  @keyframes flyDie {
    0% { opacity: 1; }
    40% { opacity: 1; filter: drop-shadow(0 0 8px #ffd23f) brightness(2); }
    100% {
      opacity: 0;
      transform: translate(var(--fx,0), calc(var(--fy,0) + 120px)) translate(-50%, -50%) rotate(540deg) scale(0.3) !important;
    }
  }
  .shockwave {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 6px solid #ffd23f;
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: shock 0.7s forwards ease-out;
    z-index: 3;
  }
  @keyframes shock {
    0% { width: 40px; height: 40px; border-width: 6px; opacity: 1; box-shadow: 0 0 20px #ffd23f, inset 0 0 20px #fff; }
    100% { width: 1000px; height: 1000px; border-width: 1px; opacity: 0; }
  }

  #hud {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    gap: 6px;
    z-index: 20;
    pointer-events: none;
    flex-wrap: wrap;
  }
  .score-card {
    background: #fff9e6;
    border: 3px solid #3b2509;
    border-radius: 12px;
    padding: 5px 12px;
    font-family: 'Bungee', sans-serif;
    font-size: 16px;
    color: #3b2509;
    box-shadow: 3px 3px 0 #3b2509;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .score-card .emoji { font-family: sans-serif; }
  .progress-bar {
    position: absolute;
    left: 50%;
    top: 56px;
    transform: translateX(-50%);
    width: min(340px, 80vw);
    height: 14px;
    background: rgba(255,249,230,0.3);
    border: 3px solid #3b2509;
    border-radius: 10px;
    overflow: hidden;
    z-index: 20;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg,#ffd23f,#ff8a3d);
    width: 0%;
    transition: width 0.3s;
    box-shadow: inset 0 0 8px rgba(255,255,255,0.5);
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.5), rgba(0,0,0,0.85));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 24px;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .overlay h1 {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(38px, 11vw, 64px);
    color: #ffd23f;
    text-shadow: 4px 4px 0 #3b2509, 8px 8px 0 rgba(0,0,0,0.4);
    margin-bottom: 14px;
    transform: rotate(-3deg);
    line-height: 0.95;
    letter-spacing: 1px;
  }
  .overlay p {
    color: #fff9e6;
    font-size: 17px;
    margin-bottom: 22px;
    max-width: 380px;
    line-height: 1.5;
    font-weight: 500;
  }
  .btn {
    background: #ffd23f;
    border: 5px solid #3b2509;
    color: #3b2509;
    font-family: 'Bungee', sans-serif;
    font-size: 24px;
    padding: 12px 32px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #3b2509;
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 1px;
    margin: 6px;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #3b2509; }
  .btn.secondary { background: #fff9e6; font-size: 18px; padding: 10px 20px; }
  .back-btn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 21;
    background: #fff9e6;
    border: 3px solid #3b2509;
    border-radius: 10px;
    padding: 5px 12px;
    font-family: 'Bungee', sans-serif;
    font-size: 12px;
    color: #3b2509;
    text-decoration: none;
    box-shadow: 3px 3px 0 #3b2509;
    display: none;
  }
  body:not(.playing) .back-btn { display: block; }
  .hidden { display: none !important; }
  .game-over-emoji {
    font-size: 80px;
    margin-bottom: 4px;
    animation: spin 0.8s ease-out;
    filter: drop-shadow(4px 4px 0 rgba(0,0,0,0.3));
  }
  @keyframes spin {
    from { transform: rotate(0) scale(0); }
    to { transform: rotate(540deg) scale(1); }
  }
  .shake { animation: shake 0.5s; }
  @keyframes shake {
    0%, 100% { transform: translate(0); }
    20% { transform: translate(-8px, 6px); }
    40% { transform: translate(7px, -5px); }
    60% { transform: translate(-5px, -6px); }
    80% { transform: translate(6px, 4px); }
  }
  .new-best {
    display: inline-block;
    background: #ff4e6b;
    color: #fff9e6;
    font-family: 'Bungee', sans-serif;
    padding: 6px 14px;
    border-radius: 10px;
    border: 3px solid #3b2509;
    transform: rotate(-3deg);
    margin-bottom: 14px;
    font-size: 16px;
    box-shadow: 3px 3px 0 #3b2509;
  }
  .world-select {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 10px;
    max-width: 520px;
    width: 100%;
    margin: 10px 0 18px;
  }
  .world-btn {
    background: #fff9e6;
    border: 4px solid #3b2509;
    border-radius: 14px;
    padding: 10px 6px;
    cursor: pointer;
    box-shadow: 4px 4px 0 #3b2509;
    font-family: 'Bungee', sans-serif;
    color: #3b2509;
    transition: transform 0.08s, box-shadow 0.08s;
    position: relative;
  }
  .world-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 #3b2509; }
  .world-btn.locked { opacity: 0.55; cursor: not-allowed; background: #c0b8a8; }
  .world-btn.locked:active { transform: none; box-shadow: 4px 4px 0 #3b2509; }
  .world-btn .we { font-size: 38px; display: block; margin-bottom: 4px; font-family: sans-serif; }
  .world-btn .wn { font-size: 14px; }
  .world-btn .lock { position: absolute; top: 4px; right: 6px; font-size: 18px; font-family: sans-serif; }
  .banner {
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: 'Bungee', sans-serif;
    font-size: clamp(36px, 10vw, 72px);
    color: #ffd23f;
    text-shadow: 4px 4px 0 #3b2509, 8px 8px 0 rgba(0,0,0,0.4);
    z-index: 50;
    pointer-events: none;
    animation: bannerPop 2s forwards;
    text-align: center;
    white-space: nowrap;
  }
  @keyframes bannerPop {
    0% { opacity: 0; transform: translate(-50%,-50%) scale(0.4) rotate(-15deg); }
    20% { opacity: 1; transform: translate(-50%,-50%) scale(1.15) rotate(3deg); }
    40% { transform: translate(-50%,-50%) scale(1) rotate(-2deg); }
    80% { opacity: 1; transform: translate(-50%,-50%) scale(1) rotate(-2deg); }
    100% { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
  }
</style>
</head>
<body>
<a href="index.html" class="back-btn">← Portal</a>
<div id="game" class="world-toilet">
  <div id="decorations"></div>
  <div id="hud">
    <div class="score-card"><span class="emoji">💩</span><span id="score">0</span></div>
    <div class="score-card"><span id="world-name">Toilet</span> · L<span id="level">1</span></div>
    <div class="score-card"><span class="emoji">🏆</span><span id="high">0</span></div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div id="start-overlay" class="overlay">
    <h1>Lort på Løb</h1>
    <p>Vælg en verden at spille i:<br>(Hver verden har unikke fjender og power-ups)</p>
    <div class="world-select" id="world-select"></div>
    <p style="font-size:14px;opacity:0.8;">📱 Styr med fingeren · 🖱️ eller musen</p>
  </div>

  <div id="game-over-overlay" class="overlay hidden">
    <div class="game-over-emoji" id="game-over-emoji">🪰</div>
    <h1 id="game-over-title">Nom nom!</h1>
    <p id="game-over-text">En fjende fik fat i dig!<br>Du samlede <b><span id="final-score">0</span></b> denne runde</p>
    <div id="new-best-badge" class="new-best hidden">🎉 Ny rekord!</div>
    <button class="btn" id="restart-btn">PRØV IGEN</button>
    <button class="btn secondary" id="menu-btn">Vælg verden</button>
  </div>

  <div id="level-clear-overlay" class="overlay hidden">
    <div style="font-size:90px;margin-bottom:10px;animation:spin 0.8s ease-out;">🎉</div>
    <h1 id="clear-title">LEVEL KLARET!</h1>
    <p id="clear-text">Du er klar til næste verden!</p>
    <button class="btn" id="next-btn">VIDERE →</button>
  </div>
</div>
<script>
/* ============================================================
   WORLDS CONFIG
   Each world has: name, class, enemies, collectible, power, target, speed multiplier
   ============================================================ */
const WORLDS = [
  {
    id: 'toilet',
    name: 'Toilet',
    emoji: '🚽',
    cls: 'world-toilet',
    enemies: ['🪰'],
    collectible: '🧻',
    collectibleLabel: 'ruller',
    power: '🧻',
    powerName: 'Gylden Rulle',
    target: 10,
    speedBoost: 0,
    decor: () => ({ top: ['🧴','🧽','🚿'], bottom: ['🧻','🪥','🧼'] })
  },
  {
    id: 'kloak',
    name: 'Kloak',
    emoji: '🦠',
    cls: 'world-kloak',
    enemies: ['🐀','🪰'],
    collectible: '🦆',
    collectibleLabel: 'gummiænder',
    power: '🧀',
    powerName: 'Ost',
    target: 12,
    speedBoost: 0.3,
    decor: () => ({ top: ['💡','🕸️'], bottom: ['🦠','💧','🗑️'] })
  },
  {
    id: 'skov',
    name: 'Skov',
    emoji: '🌲',
    cls: 'world-skov',
    enemies: ['🦟','🐝'],
    collectible: '🍄',
    collectibleLabel: 'svampe',
    power: '⚡',
    powerName: 'Lynbolt',
    target: 15,
    speedBoost: 0.5,
    decor: () => ({ top: ['☁️','🦋','🌳'], bottom: ['🌿','🌼','🍀','🌻'] })
  },
  {
    id: 'strand',
    name: 'Strand',
    emoji: '🏖️',
    cls: 'world-strand',
    enemies: ['🦀','🐦'],
    collectible: '🍦',
    collectibleLabel: 'is',
    power: '⚽',
    powerName: 'Strandbold',
    target: 18,
    speedBoost: 0.7,
    decor: () => ({ top: ['☀️','🌴','☁️'], bottom: ['🐚','⭐','🏖️'] })
  },
  {
    id: 'rum',
    name: 'Rumstation',
    emoji: '🚀',
    cls: 'world-rum',
    enemies: ['👾','🛸'],
    collectible: '⭐',
    collectibleLabel: 'stjerner',
    power: '🕳️',
    powerName: 'Sort Hul',
    target: 22,
    speedBoost: 1.0,
    decor: () => ({ top: ['🌟','🪐','🌙','☄️'], bottom: ['🌠','✨','⭐'] })
  }
];

/* ============================================================
   STATE
   ============================================================ */
const game = document.getElementById('game');
const decorations = document.getElementById('decorations');
const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const levelEl = document.getElementById('level');
const worldNameEl = document.getElementById('world-name');
const progressEl = document.getElementById('progress');
const finalScoreEl = document.getElementById('final-score');
const newBestBadge = document.getElementById('new-best-badge');
const startOverlay = document.getElementById('start-overlay');
const gameOverOverlay = document.getElementById('game-over-overlay');
const levelClearOverlay = document.getElementById('level-clear-overlay');
const worldSelect = document.getElementById('world-select');
const restartBtn = document.getElementById('restart-btn');
const menuBtn = document.getElementById('menu-btn');
const nextBtn = document.getElementById('next-btn');
const gameOverTitle = document.getElementById('game-over-title');
const gameOverText = document.getElementById('game-over-text');
const gameOverEmojiEl = document.getElementById('game-over-emoji');
const clearTitle = document.getElementById('clear-title');
const clearText = document.getElementById('clear-text');

let W = window.innerWidth, H = window.innerHeight;
let poop = { x: W/2, y: H/2, tx: W/2, ty: H/2, flip: 1 };
let collectibles = [];
let enemies = [];
let powerUp = null;
let score = 0;
let runScore = 0;
let highScore = parseInt(localStorage.getItem('poop_highscore') || '0', 10);
let running = false;
let worldIdx = 0;
let currentWorld = WORLDS[0];
let lastSpawn = 0, lastEnemy = 0, lastPower = 0, startTime = 0;
let unlocked = parseInt(localStorage.getItem('poop_unlocked') || '1', 10); // how many worlds unlocked

highEl.textContent = highScore;

/* ============================================================
   DECORATIONS
   ============================================================ */
function setupDecor() {
  decorations.innerHTML = '';
  const dec = currentWorld.decor();
  // top
  for (let i=0; i<6; i++) {
    const c = document.createElement('div');
    c.className = 'decor';
    c.textContent = dec.top[Math.floor(Math.random()*dec.top.length)];
    c.style.left = Math.random()*W + 'px';
    c.style.top = Math.random()*H*0.32 + 'px';
    c.style.fontSize = (32 + Math.random()*32) + 'px';
    c.style.opacity = 0.7 + Math.random()*0.3;
    decorations.appendChild(c);
  }
  // bottom
  for (let i=0; i<22; i++) {
    const f = document.createElement('div');
    f.className = 'decor';
    f.textContent = dec.bottom[Math.floor(Math.random()*dec.bottom.length)];
    f.style.left = Math.random()*W + 'px';
    f.style.top = (H*0.42 + Math.random()*H*0.55) + 'px';
    f.style.fontSize = (14 + Math.random()*20) + 'px';
    f.style.opacity = 0.7 + Math.random()*0.3;
    decorations.appendChild(f);
  }
  // world-specific extras
  if (currentWorld.id === 'rum') {
    for (let i=0; i<40; i++) {
      const s = document.createElement('div');
      s.className = 'decor';
      s.textContent = '·';
      s.style.left = Math.random()*W + 'px';
      s.style.top = Math.random()*H + 'px';
      s.style.color = '#fff';
      s.style.fontSize = (10 + Math.random()*20) + 'px';
      s.style.opacity = Math.random();
      decorations.appendChild(s);
    }
  }
}

function setWorld(idx) {
  worldIdx = idx;
  currentWorld = WORLDS[idx];
  game.className = currentWorld.cls;
  worldNameEl.textContent = currentWorld.name;
  levelEl.textContent = idx + 1;
  setupDecor();
}

window.addEventListener('resize', () => {
  W = window.innerWidth; H = window.innerHeight;
  setupDecor();
});

/* ============================================================
   POOP
   ============================================================ */
const poopEl = document.createElement('div');
poopEl.className = 'poop';
poopEl.innerHTML = '<span class="poop-inner">💩</span>';
game.appendChild(poopEl);

function updatePoop() {
  poopEl.style.transform = `translate(${poop.x}px, ${poop.y}px) translate(-50%, -50%) scaleX(${poop.flip})`;
}
updatePoop();

function setTarget(x, y) { poop.tx = x; poop.ty = y; }
game.addEventListener('mousemove', (e) => setTarget(e.clientX, e.clientY));
game.addEventListener('touchmove', (e) => {
  const t = e.touches[0]; setTarget(t.clientX, t.clientY); e.preventDefault();
}, { passive: false });
game.addEventListener('touchstart', (e) => {
  const t = e.touches[0]; setTarget(t.clientX, t.clientY);
});

/* ============================================================
   SPAWNING
   ============================================================ */
function spawnCollectible() {
  const el = document.createElement('div');
  el.className = 'collectible';
  el.textContent = currentWorld.collectible;
  const c = {
    x: 60 + Math.random()*(W-120),
    y: 140 + Math.random()*(H-240),
    el
  };
  el.style.left = c.x + 'px';
  el.style.top = c.y + 'px';
  game.appendChild(el);
  collectibles.push(c);
}

function spawnEnemy() {
  const el = document.createElement('div');
  el.className = 'enemy';
  const kind = currentWorld.enemies[Math.floor(Math.random()*currentWorld.enemies.length)];
  el.textContent = kind;
  const side = Math.floor(Math.random()*4);
  let x, y;
  if (side===0) { x = -40; y = Math.random()*H; }
  else if (side===1) { x = W+40; y = Math.random()*H; }
  else if (side===2) { x = Math.random()*W; y = -40; }
  else { x = Math.random()*W; y = H+40; }
  // Rats/crabs stay lower on screen (ground enemies)
  if (kind === '🐀' || kind === '🦀') y = H*0.6 + Math.random()*H*0.35;
  const f = {
    x, y, el, kind,
    t: Math.random()*100,
    speed: 1.2 + Math.random()*0.7 + currentWorld.speedBoost + Math.min(runScore*0.04, 1.2),
    dying: false,
    ground: kind === '🐀' || kind === '🦀'
  };
  el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`;
  game.appendChild(el);
  enemies.push(f);
}

function spawnPowerUp() {
  if (powerUp) return;
  const el = document.createElement('div');
  el.className = 'power-up';
  el.textContent = currentWorld.power;
  const p = {
    x: 80 + Math.random()*(W-160),
    y: 150 + Math.random()*(H-260),
    el,
    spawnTime: performance.now()
  };
  el.style.left = p.x + 'px';
  el.style.top = p.y + 'px';
  game.appendChild(el);
  powerUp = p;
}

function killAllEnemies() {
  const shock = document.createElement('div');
  shock.className = 'shockwave';
  shock.style.left = poop.x + 'px';
  shock.style.top = poop.y + 'px';
  game.appendChild(shock);
  setTimeout(() => shock.remove(), 700);

  for (const f of enemies) {
    if (f.dying) continue;
    f.dying = true;
    const dx = f.x - poop.x, dy = f.y - poop.y;
    const d = Math.hypot(dx, dy) || 1;
    const pushX = (dx/d) * 200, pushY = (dy/d) * 200 - 40;
    f.el.style.setProperty('--fx', pushX + 'px');
    f.el.style.setProperty('--fy', pushY + 'px');
    f.el.style.transform = `translate(${f.x}px, ${f.y}px) translate(-50%, -50%)`;
    f.el.classList.add('enemy-dying');
  }
  const dying = enemies.slice();
  enemies = [];
  setTimeout(() => { for (const f of dying) f.el.remove(); }, 700);
}

function sparkleAt(x, y, text='+1') {
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.textContent = text;
  s.style.left = x + 'px';
  s.style.top = y + 'px';
  game.appendChild(s);
  setTimeout(() => s.remove(), 700);
}

function showBanner(text) {
  const b = document.createElement('div');
  b.className = 'banner';
  b.textContent = text;
  game.appendChild(b);
  setTimeout(() => b.remove(), 2000);
}

function collide(a, b, r) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return dx*dx + dy*dy < r*r;
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let lastTime = 0;
function loop(t) {
  const dt = Math.min(32, t - lastTime) / 16;
  lastTime = t;

  if (running) {
    const prevX = poop.x;
    poop.x += (poop.tx - poop.x) * 0.2 * dt;
    poop.y += (poop.ty - poop.y) * 0.2 * dt;
    poop.x = Math.max(30, Math.min(W-30, poop.x));
    poop.y = Math.max(30, Math.min(H-30, poop.y));
    if (poop.x - prevX > 0.5) poop.flip = 1;
    else if (poop.x - prevX < -0.5) poop.flip = -1;
    updatePoop();

    // spawn collectibles
    if (t - lastSpawn > 1300 && collectibles.length < 5) {
      spawnCollectible();
      lastSpawn = t;
    }

    // spawn enemies
    const elapsed = (t - startTime) / 1000;
    const flyInterval = Math.max(650, 2800 - runScore*110 - elapsed*20 - currentWorld.speedBoost*200);
    if (t - startTime > 1500 && t - lastEnemy > flyInterval) {
      spawnEnemy();
      lastEnemy = t;
    }

    // power-up
    const hectic = enemies.length >= 3 || runScore >= 5;
    if (hectic && !powerUp && t - lastPower > 12000 + Math.random()*5000) {
      spawnPowerUp();
      lastPower = t;
    }
    if (powerUp && t - powerUp.spawnTime > 8000) {
      powerUp.el.remove();
      powerUp = null;
    }

    // collectibles
    for (let i = collectibles.length-1; i >= 0; i--) {
      const c = collectibles[i];
      if (collide(poop, c, 46)) {
        sparkleAt(c.x, c.y, '+1');
        c.el.remove();
        collectibles.splice(i, 1);
        runScore++;
        score++;
        scoreEl.textContent = score;
        updateProgress();
        if (runScore >= currentWorld.target) {
          levelClear();
          return;
        }
      }
    }

    // power-up
    if (powerUp && collide(poop, powerUp, 52)) {
      sparkleAt(powerUp.x, powerUp.y, 'BOOM!');
      powerUp.el.remove();
      powerUp = null;
      killAllEnemies();
    }

    // enemies
    for (const f of enemies) {
      if (f.dying) continue;
      f.t += 0.06 * dt;
      const dx = poop.x - f.x, dy = poop.y - f.y;
      const d = Math.hypot(dx, dy) || 1;
      let vx = (dx/d) * f.speed, vy = (dy/d) * f.speed;
      if (f.ground) vy *= 0.3; // ground enemies don't chase vertically as much
      f.x += vx * dt + Math.sin(f.t*3.5) * 1.6;
      f.y += vy * dt + Math.cos(f.t*3.5) * 1.6;
      const wiggle = Math.sin(f.t*10)*18;
      f.el.style.transform = `translate(${f.x}px, ${f.y}px) translate(-50%, -50%) rotate(${wiggle}deg)`;
      if (collide(poop, f, 34)) {
        gameOver(f.kind);
        break;
      }
    }
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============================================================
   FLOW
   ============================================================ */
function updateProgress() {
  const pct = Math.min(100, (runScore / currentWorld.target) * 100);
  progressEl.style.width = pct + '%';
}

function clearField() {
  collectibles.forEach(c => c.el.remove());
  enemies.forEach(e => e.el.remove());
  if (powerUp) { powerUp.el.remove(); powerUp = null; }
  collectibles = [];
  enemies = [];
}

function buildWorldSelect() {
  worldSelect.innerHTML = '';
  WORLDS.forEach((w, i) => {
    const b = document.createElement('button');
    b.className = 'world-btn' + (i >= unlocked ? ' locked' : '');
    b.innerHTML = `<span class="we">${w.emoji}</span><span class="wn">${w.name}</span>` +
      (i >= unlocked ? '<span class="lock">🔒</span>' : '');
    b.onclick = () => {
      if (i >= unlocked) return;
      startGame(i);
    };
    worldSelect.appendChild(b);
  });
}
buildWorldSelect();

function startGame(idx) {
  setWorld(idx);
  runScore = 0;
  clearField();
  poop.x = W/2; poop.y = H/2;
  poop.tx = W/2; poop.ty = H/2;
  running = true;
  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  levelClearOverlay.classList.add('hidden');
  newBestBadge.classList.add('hidden');
  document.body.classList.add('playing');
  const now = performance.now();
  lastSpawn = now; lastEnemy = now; lastPower = now; startTime = now;
  updateProgress();
  showBanner(currentWorld.name.toUpperCase() + '!');
}

function levelClear() {
  running = false;
  clearField();
  // unlock next world
  if (worldIdx + 1 > unlocked - 1 && worldIdx + 1 < WORLDS.length) {
    unlocked = Math.min(WORLDS.length, worldIdx + 2);
    localStorage.setItem('poop_unlocked', unlocked);
  }
  // save high score
  if (score > highScore) {
    highScore = score;
    highEl.textContent = highScore;
    localStorage.setItem('poop_highscore', highScore);
  }
  buildWorldSelect();
  if (worldIdx + 1 >= WORLDS.length) {
    clearTitle.textContent = 'DU VANDT ALT!';
    clearText.innerHTML = `Wow! Du har klaret alle 5 verdener!<br>Du er den ultimative lort 💩👑<br>Samlet score: <b>${score}</b>`;
    nextBtn.textContent = 'SPIL IGEN';
  } else {
    clearTitle.textContent = 'VERDEN KLARET!';
    const next = WORLDS[worldIdx + 1];
    clearText.innerHTML = `Godt klaret! Du åbnede op for:<br><b>${next.emoji} ${next.name}</b>`;
    nextBtn.textContent = 'VIDERE →';
  }
  document.body.classList.remove('playing');
  setTimeout(() => levelClearOverlay.classList.remove('hidden'), 400);
}

function gameOver(enemyKind) {
  running = false;
  game.classList.add('shake');
  setTimeout(() => game.classList.remove('shake'), 500);
  finalScoreEl.textContent = runScore;
  gameOverEmojiEl.textContent = enemyKind || '🪰';
  const messages = {
    '🪰': 'Fluerne fik fat i dig!',
    '🐀': 'En rotte bed dig!',
    '🦟': 'En myg stak dig!',
    '🐝': 'En bi stak dig!',
    '🦀': 'Krabben knep dig!',
    '🐦': 'En måge tog dig!',
    '👾': 'Aliens bortførte dig!',
    '🛸': 'Et UFO fangede dig!'
  };
  gameOverText.innerHTML = `${messages[enemyKind] || 'Du blev spist!'}<br>Du samlede <b><span id="final-score">${runScore}</span></b> ${currentWorld.collectibleLabel}`;
  let isNewBest = false;
  if (score > highScore) {
    highScore = score;
    highEl.textContent = highScore;
    isNewBest = score > 0;
    localStorage.setItem('poop_highscore', highScore);
  }
  document.body.classList.remove('playing');
  setTimeout(() => {
    if (isNewBest) newBestBadge.classList.remove('hidden');
    gameOverOverlay.classList.remove('hidden');
  }, 600);
}

restartBtn.addEventListener('click', () => startGame(worldIdx));
menuBtn.addEventListener('click', () => {
  gameOverOverlay.classList.add('hidden');
  score = 0;
  scoreEl.textContent = 0;
  clearField();
  buildWorldSelect();
  startOverlay.classList.remove('hidden');
  updateProgress();
});
nextBtn.addEventListener('click', () => {
  if (worldIdx + 1 >= WORLDS.length) {
    // reset game
    score = 0;
    scoreEl.textContent = 0;
    startGame(0);
  } else {
    startGame(worldIdx + 1);
  }
});
</script>
</body>
