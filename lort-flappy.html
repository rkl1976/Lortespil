<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lort-Flappy</title>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lortespil.css">
<script src="lortespil.js" defer></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; font-family: 'Fredoka', sans-serif; background: #ffb6a3; }
  body { touch-action: none; position: fixed; width: 100%; }
  #game { position: relative; width: 100vw; height: 100vh; overflow: hidden; cursor: pointer; }
  canvas { display: block; width: 100%; height: 100%; }

  #hud {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    z-index: 10;
    pointer-events: none;
    gap: 6px;
  }
  .score-card {
    background: #fff9e6;
    border: 3px solid #3b2509;
    border-radius: 12px;
    padding: 5px 12px;
    font-family: 'Bungee', sans-serif;
    font-size: 16px;
    color: #3b2509;
    box-shadow: 3px 3px 0 #3b2509;
  }
  .big-score {
    position: absolute;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Bungee', sans-serif;
    font-size: 80px;
    color: #fff9e6;
    text-shadow: 4px 4px 0 #3b2509, 8px 8px 0 rgba(0,0,0,0.4);
    z-index: 9;
    pointer-events: none;
    opacity: 0.9;
  }
  .back-btn {
    position: absolute;
    top: max(14px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 11;
    background: #fff9e6;
    border: 3px solid #3b2509;
    border-radius: 10px;
    padding: 5px 12px;
    font-family: 'Bungee', sans-serif;
    font-size: 12px;
    color: #3b2509;
    text-decoration: none;
    box-shadow: 3px 3px 0 #3b2509;
    display: none;
  }
  body:not(.playing) .back-btn { display: block; }
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(0,0,0,0.55), rgba(0,0,0,0.9));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 24px;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
  }
  .overlay h1 {
    font-family: 'Bungee', sans-serif;
    font-size: clamp(40px, 11vw, 68px);
    color: #ffd23f;
    text-shadow: 4px 4px 0 #3b2509, 8px 8px 0 rgba(0,0,0,0.4);
    margin-bottom: 14px;
    transform: rotate(-3deg);
  }
  .overlay p {
    color: #fff9e6;
    font-size: 17px;
    margin-bottom: 22px;
    max-width: 380px;
    line-height: 1.5;
  }
  .btn {
    background: #ffd23f;
    border: 5px solid #3b2509;
    color: #3b2509;
    font-family: 'Bungee', sans-serif;
    font-size: 24px;
    padding: 12px 32px;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 6px 6px 0 #3b2509;
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 1px;
  }
  .btn:active { transform: translate(4px, 4px); box-shadow: 2px 2px 0 #3b2509; }
  .hidden { display: none !important; }
  .new-best {
    display: inline-block;
    background: #ff4e6b;
    color: #fff9e6;
    font-family: 'Bungee', sans-serif;
    padding: 5px 12px;
    border-radius: 10px;
    border: 3px solid #3b2509;
    transform: rotate(-3deg);
    margin-bottom: 14px;
    font-size: 15px;
    box-shadow: 3px 3px 0 #3b2509;
  }
  .tap-hint {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: rgba(255,249,230,0.9);
    border: 4px solid #3b2509;
    border-radius: 20px;
    padding: 20px 32px;
    font-family: 'Bungee', sans-serif;
    color: #3b2509;
    text-align: center;
    z-index: 20;
    box-shadow: 5px 5px 0 #3b2509;
    animation: pulse 1s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: translate(-50%,-50%) scale(1); }
    100% { transform: translate(-50%,-50%) scale(1.06); }
  }
  #boost-indicator {
    position: absolute;
    top: max(54px, calc(env(safe-area-inset-top) + 54px));
    right: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: #fff9e6;
    border: 3px solid #3b2509;
    border-radius: 12px;
    padding: 5px 10px;
    font-family: 'Bungee', sans-serif;
    font-size: 14px;
    color: #3b2509;
    box-shadow: 3px 3px 0 #3b2509;
    z-index: 10;
    transition: transform 0.15s;
  }
  #boost-indicator.empty { opacity: 0.5; }
  #boost-indicator.pulse { animation: boostPulse 0.6s infinite alternate; }
  @keyframes boostPulse {
    from { transform: scale(1); }
    to   { transform: scale(1.1); background: #ffd23f; }
  }
  #boost-hint {
    position: absolute;
    top: max(54px, calc(env(safe-area-inset-top) + 54px));
    right: 10px;
    transform: translateY(38px);
    background: rgba(255,249,230,0.9);
    border: 2px solid #3b2509;
    border-radius: 8px;
    padding: 2px 8px;
    font-family: 'Fredoka', sans-serif;
    font-size: 11px;
    color: #3b2509;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>
<a href="index.html" class="back-btn">← Portal</a>
<div id="game">
  <canvas id="c"></canvas>
  <div id="hud">
    <div class="score-card">💩 <span id="score">0</span></div>
    <div class="score-card">🏆 <span id="high">0</span></div>
  </div>
  <div id="boost-indicator" class="empty hidden">💨 <span id="boost-count">0</span></div>
  <div id="boost-hint" class="hidden">B / dobbelt-tap</div>
  <div class="big-score hidden" id="big-score">0</div>
  <div class="tap-hint hidden" id="tap-hint">TAP for at FLYVE!<br><span style="font-size:14px;font-family:Fredoka,sans-serif;font-weight:500;">Undvig rørene</span></div>

  <div id="start-overlay" class="overlay">
    <h1>LORT<br>FLAPPY</h1>
    <p>Flyv lorten 💩 gennem toiletrørene 🧻<br>Tap (eller space/klik) for at flappe opad<br>Bliv ikke ramt! 💥<br><br>Hvor langt kan du komme?</p>
    <button class="btn" id="start-btn">START!</button>
  </div>

  <div id="game-over-overlay" class="overlay hidden">
    <div style="font-size:80px;margin-bottom:6px;animation:spin 0.8s;">💥</div>
    <h1>SPLAT!</h1>
    <p>Du klarede <b><span id="final">0</span></b> rør<br>Bedste nogensinde: <b><span id="best">0</span></b></p>
    <div id="new-best" class="new-best hidden">🎉 Ny rekord!</div>
    <button class="btn" id="restart-btn">PRØV IGEN</button>
  </div>
</div>
<style>
  @keyframes spin { from { transform: rotate(0) scale(0); } to { transform: rotate(540deg) scale(1); } }
</style>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = window.innerWidth, H = window.innerHeight;
let DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// Game state
let player = { x: 0, y: 0, vy: 0, size: 48, rot: 0 };
const basePlayerSize = 48;
let pipes = []; // { x, gapY, gapH, scored, paper? }
let clouds = [];
let particles = [];
let paperItems = []; // collectible toilet papers
let boostItems = []; // collectible fart boosts {x,y}
let score = 0;
let papers = 0;
let running = false;
let waitingToStart = false;
let lastPipeX = 0;
let PIPE_W = 70;
let GAP_H = 180;
let highScore = parseInt(localStorage.getItem('flappy_highscore') || '0', 10);
document.getElementById('high').textContent = highScore;

// --- Twist state ---
let fartBoosts = 0;
let boostActive = false;
let boostTimer = 0;     // ms remaining
let lastBoostSpawn = 0; // performance.now()-based
let gameStartT = 0;
let lastSpaceTap = 0;
let touchStartT = 0;
let lastTouchTap = 0;
const boostIndicator = document.getElementById('boost-indicator');
const boostCountEl = document.getElementById('boost-count');
const boostHint = document.getElementById('boost-hint');

function updateBoostUI() {
  if (!boostIndicator) return;
  boostCountEl.textContent = fartBoosts;
  if (fartBoosts > 0) {
    boostIndicator.classList.remove('hidden');
    boostIndicator.classList.remove('empty');
    if (boostHint) boostHint.classList.remove('hidden');
  } else {
    boostIndicator.classList.add('empty');
    if (boostHint) boostHint.classList.add('hidden');
  }
  if (boostActive) boostIndicator.classList.add('pulse');
  else boostIndicator.classList.remove('pulse');
}

const scoreEl = document.getElementById('score');
const highEl = document.getElementById('high');
const bigScore = document.getElementById('big-score');
const finalEl = document.getElementById('final');
const bestEl = document.getElementById('best');
const startOverlay = document.getElementById('start-overlay');
const gameOverOverlay = document.getElementById('game-over-overlay');
const newBest = document.getElementById('new-best');
const tapHint = document.getElementById('tap-hint');

function initClouds() {
  clouds = [];
  for (let i=0; i<6; i++) {
    clouds.push({
      x: Math.random()*W,
      y: 50 + Math.random()*H*0.3,
      speed: 0.2 + Math.random()*0.3,
      size: 40 + Math.random()*40,
      emoji: ['☁️','💨'][Math.floor(Math.random()*2)]
    });
  }
}
initClouds();

function draw() {
  // Sky gradient
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#ffdf7a');
  g.addColorStop(0.4, '#ffb6a3');
  g.addColorStop(1, '#ff8a3d');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Clouds
  for (const c of clouds) {
    ctx.font = c.size + 'px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = 0.7;
    ctx.fillText(c.emoji, c.x, c.y);
    ctx.globalAlpha = 1;
    if (running) {
      c.x -= c.speed;
      if (c.x < -50) {
        c.x = W + 50;
        c.y = 50 + Math.random()*H*0.3;
      }
    }
  }

  // Ground
  const groundY = H - 60;
  ctx.fillStyle = '#6b4423';
  ctx.fillRect(0, groundY, W, 60);
  // tile pattern
  ctx.fillStyle = '#8b5a3b';
  for (let x = -((performance.now()/8) % 40); x < W; x += 40) {
    ctx.fillRect(x, groundY, 30, 8);
  }
  ctx.fillStyle = '#3b2509';
  ctx.fillRect(0, groundY-4, W, 4);

  // Pipes
  for (const p of pipes) {
    drawPipe(p.x, 0, PIPE_W, p.gapY, true);
    drawPipe(p.x, p.gapY + p.gapH, PIPE_W, groundY - (p.gapY + p.gapH), false);
  }

  // Toilet paper collectibles
  for (const pp of paperItems) {
    ctx.save();
    const bob = Math.sin(performance.now()/200 + pp.x) * 5;
    ctx.font = '34px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#ffd23f';
    ctx.shadowBlur = 12;
    ctx.fillText('🧻', pp.x, pp.y + bob);
    ctx.restore();
  }

  // Fart-boost power-ups
  for (const b of boostItems) {
    ctx.save();
    const bob = Math.sin(performance.now()/180 + b.x*0.02) * 6;
    const scale = 1 + Math.sin(performance.now()/140) * 0.08;
    ctx.translate(b.x, b.y + bob);
    ctx.scale(scale, scale);
    ctx.font = '38px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#a8e06a';
    ctx.shadowBlur = 18;
    ctx.fillText('💨', 0, 0);
    ctx.restore();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life/30);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Player (rotated poop)
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.rot);
  const drawSize = boostActive ? player.size * 0.6 : player.size;
  ctx.font = drawSize + 'px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (boostActive) {
    ctx.shadowColor = '#a8e06a';
    ctx.shadowBlur = 20;
  } else {
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 3;
  }
  ctx.fillText('💩', 0, 0);
  ctx.restore();

  // Speed lines when flapping
  if (player.vy < -5) {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 3;
    for (let i=0; i<3; i++) {
      ctx.beginPath();
      ctx.moveTo(player.x - 20, player.y + 20 + i*6);
      ctx.lineTo(player.x - 35, player.y + 20 + i*6);
      ctx.stroke();
    }
  }
}

function drawPipe(x, y, w, h, isTop) {
  if (h <= 0) return;
  // Body: vertical gradient (porcelain)
  const bodyGrad = ctx.createLinearGradient(x, y, x, y + h);
  bodyGrad.addColorStop(0, '#fff8f0');
  bodyGrad.addColorStop(0.5, '#c8bfb4');
  bodyGrad.addColorStop(1, '#9a8e82');
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(x, y, w, h);

  // Left-edge highlight (cylindrical look)
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  const hlGrad = ctx.createLinearGradient(x, 0, x + 14, 0);
  hlGrad.addColorStop(0, 'rgba(255,255,255,0.55)');
  hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hlGrad;
  ctx.fillRect(x, y, 14, h);

  // Right-edge shadow
  const shGrad = ctx.createLinearGradient(x + w - 10, 0, x + w, 0);
  shGrad.addColorStop(0, 'rgba(60,36,18,0)');
  shGrad.addColorStop(1, 'rgba(60,36,18,0.35)');
  ctx.fillStyle = shGrad;
  ctx.fillRect(x + w - 10, y, 10, h);
  ctx.restore();

  // Body outline
  ctx.strokeStyle = '#3b2509';
  ctx.lineWidth = 3;
  ctx.strokeRect(x, y, w, h);

  // Very subtle horizontal seam lines for porcelain panels
  ctx.strokeStyle = 'rgba(59,37,9,0.12)';
  ctx.lineWidth = 1;
  for (let j=1; j<h/34; j++) {
    ctx.beginPath();
    ctx.moveTo(x + 2, y + j*34);
    ctx.lineTo(x + w - 2, y + j*34);
    ctx.stroke();
  }

  // Rim (cap) — 22px tall, slightly wider
  const capH = 22;
  const capX = x - 4;
  const capW = w + 8;
  const capY = isTop ? (y + h - capH) : y;

  const capGrad = ctx.createLinearGradient(capX, capY, capX, capY + capH);
  capGrad.addColorStop(0, '#ffffff');
  capGrad.addColorStop(0.5, '#e5dcd0');
  capGrad.addColorStop(1, '#b8afa2');
  ctx.fillStyle = capGrad;
  ctx.fillRect(capX, capY, capW, capH);

  // Cap left highlight
  ctx.save();
  ctx.beginPath();
  ctx.rect(capX, capY, capW, capH);
  ctx.clip();
  const capHl = ctx.createLinearGradient(capX, 0, capX + 10, 0);
  capHl.addColorStop(0, 'rgba(255,255,255,0.7)');
  capHl.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = capHl;
  ctx.fillRect(capX, capY, 10, capH);
  ctx.restore();

  // Cap outline (darker)
  ctx.strokeStyle = '#2a1a05';
  ctx.lineWidth = 3;
  ctx.strokeRect(capX, capY, capW, capH);

  // Toilet paper emoji in cap center
  ctx.font = '20px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#3b2509';
  ctx.fillText('🧻', capX + capW/2, capY + capH/2);
}

function spawnPipe() {
  const groundY = H - 60;
  const minGap = 100;
  const gapH = Math.max(140, GAP_H - Math.floor(score/5)*5);
  const gapY = minGap + Math.random() * (groundY - gapH - minGap*2);
  const p = {
    x: W + 30,
    gapY,
    gapH,
    scored: false
  };
  pipes.push(p);
  // 30% chance of paper in middle of gap
  if (Math.random() < 0.35) {
    paperItems.push({ x: W + 30 + PIPE_W/2, y: gapY + gapH/2 });
  }
}

function addParticles(x, y, color, n=10) {
  for (let i=0; i<n; i++) {
    particles.push({
      x, y,
      vx: (Math.random()-0.5)*6,
      vy: (Math.random()-0.5)*6,
      life: 30,
      size: 3 + Math.random()*3,
      color
    });
  }
}

function flap() {
  if (!running && !waitingToStart) return;
  if (waitingToStart) {
    running = true;
    waitingToStart = false;
    gameStartT = performance.now();
    lastBoostSpawn = gameStartT;
    tapHint.classList.add('hidden');
  }
  player.vy = -9;
  player.rot = -0.4;
  if (window.LS) LS.sfx.play('jump');
}

function activateBoost() {
  if (!running) return;
  if (fartBoosts <= 0 || boostActive) return;
  fartBoosts--;
  boostActive = true;
  boostTimer = 1500;
  // zoom forward instantly (x advance over ~300ms handled in update)
  player.vy = 0;
  // spawn brown clouds behind
  for (let i=0; i<22; i++) {
    particles.push({
      x: player.x - 10 - Math.random()*20,
      y: player.y + (Math.random()-0.5)*player.size*0.6,
      vx: -3 - Math.random()*4,
      vy: (Math.random()-0.5)*2,
      life: 40 + Math.random()*15,
      size: 4 + Math.random()*5,
      color: ['#6b4423','#8b5a3b','#a57a4d','#6e4520'][Math.floor(Math.random()*4)]
    });
  }
  if (window.LS) {
    LS.sfx.play('boost');
    LS.sfx.play('fart');
  }
  if (window.LS) LS.toast('💨 FART-BOOST AKTIVERET!', { duration: 900 });
  updateBoostUI();
}

function update(dt) {
  if (waitingToStart) {
    player.y += Math.sin(performance.now()/300) * 0.5;
    return;
  }
  if (!running) return;

  // Boost timer handling
  const msDt = dt * 16;
  if (boostActive) {
    boostTimer -= msDt;
    // Trail particles while active
    if (Math.random() < 0.7) {
      particles.push({
        x: player.x - 12,
        y: player.y + (Math.random()-0.5)*player.size*0.5,
        vx: -4 - Math.random()*3,
        vy: (Math.random()-0.5)*2,
        life: 25 + Math.random()*10,
        size: 3 + Math.random()*4,
        color: ['#6b4423','#8b5a3b','#a57a4d'][Math.floor(Math.random()*3)]
      });
    }
    if (boostTimer <= 0) {
      boostActive = false;
      updateBoostUI();
    }
  }

  // Gravity (suspended during boost)
  if (boostActive) {
    player.vy = 0;
  } else {
    player.vy += 0.55 * dt;
    player.vy = Math.min(player.vy, 14);
  }
  player.y += player.vy * dt;
  player.rot = Math.max(-0.5, Math.min(1.3, player.vy * 0.08));

  // Move pipes
  let scrollSpeed = 3.5 + Math.min(2.5, score * 0.03);
  if (boostActive) scrollSpeed += (200 / (1500/16)) * 4; // aggressive forward motion
  for (const p of pipes) p.x -= scrollSpeed * dt;
  for (const pp of paperItems) pp.x -= scrollSpeed * dt;
  for (const b of boostItems) b.x -= scrollSpeed * dt;
  pipes = pipes.filter(p => p.x + PIPE_W > -20);
  paperItems = paperItems.filter(pp => pp.x > -40);
  boostItems = boostItems.filter(b => b.x > -40);

  // Spawn pipes
  if (pipes.length === 0 || W - pipes[pipes.length-1].x > 220) {
    if (pipes.length === 0 || pipes[pipes.length-1].x < W - 220) {
      spawnPipe();
    }
  }

  // Spawn boost power-ups every ~20s
  if (performance.now() - lastBoostSpawn > 20000) {
    lastBoostSpawn = performance.now();
    // place between latest pipe and next
    const spawnX = W + 120;
    const spawnY = 120 + Math.random() * (H - 300);
    boostItems.push({ x: spawnX, y: spawnY });
  }

  // Check ground (ignore during boost)
  const groundY = H - 60;
  const renderSize = boostActive ? player.size * 0.6 : player.size;
  const pr = renderSize * 0.35;
  if (!boostActive) {
    if (player.y > groundY - player.size/2) {
      player.y = groundY - player.size/2;
      return gameOver();
    }
    if (player.y < 0) {
      player.y = 0;
      player.vy = 0;
    }
  } else {
    // keep player within vertical bounds during boost
    if (player.y < 20) player.y = 20;
    if (player.y > groundY - 20) player.y = groundY - 20;
  }

  // Check pipes
  for (const p of pipes) {
    if (!boostActive && player.x + pr > p.x && player.x - pr < p.x + PIPE_W) {
      if (player.y - pr < p.gapY || player.y + pr > p.gapY + p.gapH) {
        return gameOver();
      }
    }
    if (!p.scored && p.x + PIPE_W < player.x) {
      p.scored = true;
      const pointsPerPipe = Math.max(1, Math.floor(player.size / basePlayerSize));
      score += pointsPerPipe;
      scoreEl.textContent = score;
      bigScore.textContent = score;
      addParticles(player.x, player.y, '#ffd23f', 8);
      if (window.LS) LS.sfx.play('click');
    }
  }

  // Check papers
  for (let i = paperItems.length-1; i >= 0; i--) {
    const pp = paperItems[i];
    const dx = pp.x - player.x, dy = pp.y - player.y;
    if (dx*dx + dy*dy < Math.max(900, (pr+18)*(pr+18))) {
      paperItems.splice(i, 1);
      papers++;
      score++; // bonus
      // Grow the poop! (caps at 2x base)
      player.size = basePlayerSize + Math.min(papers * 2, basePlayerSize);
      scoreEl.textContent = score;
      bigScore.textContent = score;
      addParticles(pp.x, pp.y, '#fff9e6', 12);
      if (window.LS) LS.sfx.play('coin');
    }
  }

  // Check boost items
  for (let i = boostItems.length-1; i >= 0; i--) {
    const b = boostItems[i];
    const dx = b.x - player.x, dy = b.y - player.y;
    if (dx*dx + dy*dy < Math.max(1100, (pr+22)*(pr+22))) {
      boostItems.splice(i, 1);
      fartBoosts++;
      updateBoostUI();
      addParticles(b.x, b.y, '#a8e06a', 16);
      if (window.LS) {
        LS.sfx.play('powerup');
        LS.toast('💨 FART-BOOST!', { duration: 900 });
      }
    }
  }

  // Particles
  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.3 * dt;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
}

let lastT = 0;
function frame(t) {
  const dt = Math.min(32, t - lastT) / 16;
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Input
function inputFlap(e) {
  if (e) e.preventDefault();
  if (!running && !waitingToStart) return;
  flap();
}

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'ArrowUp') {
    e.preventDefault();
    const now = performance.now();
    // Space double-tap (within 300ms) = boost if available
    if (e.code === 'Space' && running && fartBoosts > 0 && now - lastSpaceTap < 300) {
      activateBoost();
      lastSpaceTap = 0;
      return;
    }
    if (e.code === 'Space') lastSpaceTap = now;
    inputFlap();
  } else if (e.code === 'KeyB') {
    e.preventDefault();
    activateBoost();
  }
});
canvas.addEventListener('mousedown', (e) => inputFlap(e));

// Touch: support long-press (>400ms) and double-tap for boost
let longPressTimer = null;
canvas.addEventListener('touchstart', (e) => {
  const now = performance.now();
  // Double-tap within 300ms -> boost
  if (running && fartBoosts > 0 && now - lastTouchTap < 300) {
    e.preventDefault();
    activateBoost();
    lastTouchTap = 0;
    return;
  }
  lastTouchTap = now;
  touchStartT = now;
  // Schedule long-press activation
  if (longPressTimer) clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    if (running && fartBoosts > 0 && !boostActive) {
      activateBoost();
      longPressTimer = null;
    }
  }, 400);
  inputFlap(e);
}, { passive: false });
canvas.addEventListener('touchend', (e) => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});
canvas.addEventListener('touchcancel', () => {
  if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
});

function prepare() {
  pipes = [];
  paperItems = [];
  boostItems = [];
  particles = [];
  score = 0;
  papers = 0;
  fartBoosts = 0;
  boostActive = false;
  boostTimer = 0;
  lastBoostSpawn = performance.now();
  player.size = basePlayerSize;
  scoreEl.textContent = 0;
  bigScore.textContent = 0;
  player.x = Math.min(120, W * 0.25);
  player.y = H / 2;
  player.vy = 0;
  player.rot = 0;
  waitingToStart = true;
  running = false;
  updateBoostUI();
  document.body.classList.add('playing');
  startOverlay.classList.add('hidden');
  gameOverOverlay.classList.add('hidden');
  newBest.classList.add('hidden');
  bigScore.classList.remove('hidden');
  tapHint.classList.remove('hidden');
}

function gameOver() {
  running = false;
  waitingToStart = false;
  boostActive = false;
  addParticles(player.x, player.y, '#ff4e6b', 25);
  document.body.classList.remove('playing');
  finalEl.textContent = score;
  if (window.LS) {
    LS.sfx.play('splat');
    setTimeout(() => { if (window.LS) LS.sfx.play('gameover'); }, 260);
  }

  let isNew = false;
  const result = window.LS ? LS.reportGameEnd({
    gameKey: 'flappy',
    score,
    extra: { score, papers }
  }) : null;

  if (result) {
    isNew = !!result.isNewHigh;
    if (result.isNewHigh) {
      highScore = score;
      highEl.textContent = highScore;
    }
    if (result.dailyCompleted) {
      LS.toast('🎉 DAGENS LORT FULDFØRT! +' + (result.dailyBonus||0) + ' 🪙', { duration: 2800 });
    }
  } else {
    if (score > highScore) {
      highScore = score;
      highEl.textContent = highScore;
      localStorage.setItem('flappy_highscore', highScore);
      isNew = score > 0;
    }
  }

  bestEl.textContent = highScore;
  bigScore.classList.add('hidden');
  tapHint.classList.add('hidden');
  if (boostIndicator) boostIndicator.classList.add('hidden');
  if (boostHint) boostHint.classList.add('hidden');
  setTimeout(() => {
    if (isNew) newBest.classList.remove('hidden');
    gameOverOverlay.classList.remove('hidden');
  }, 700);
}

document.getElementById('start-btn').onclick = prepare;
document.getElementById('restart-btn').onclick = prepare;

// initial player position
player.x = Math.min(120, W * 0.25);
player.y = H / 2;

document.addEventListener('DOMContentLoaded', () => {
  if (window.LS && LS.mountMuteButton) LS.mountMuteButton();
});
window.addEventListener('load', () => {
  if (window.LS && LS.mountMuteButton) LS.mountMuteButton();
});
</script>
